[app]
Title=Prince of Persia (SDLPoP)
Author=Dávid Nagy (NagyD) and contributors; Prince of Persia by Jordan Mechner, 1989
Version=1.24-RC-1
Image=icon.png
Readme=readme.txt
# the program for this machine (the launcher's docs/app-format-plan.md): bin/psc/prince on the console,
# bin/rpi, bin/rpi64, bin/pcusb on the appliances, bin/win/prince.exe on Windows. It finds data/, SDLPoP.ini
# and its saves in the folder it is started in - the launcher starts every App in its own folder.
Exec=bin/{key}/prince
# SDLPoP needs SDL2 and SDL2_image only: the launcher's (the console, Windows) or the system's - nothing of its own
# SDLPoP reads the pad through SDL's GameController API; the virtual pad shows it an Xbox 360 pad, whose
# buttons SDLPoP already lays out as the PlayStation Classic port did
VirtualPad=true
Kernel=false
